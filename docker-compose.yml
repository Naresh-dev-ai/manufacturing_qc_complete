services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: manufacturing_qc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manufacturing_qc"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:localdevpassword@db:5432/manufacturing_qc
      JWT_SECRET_KEY: local-docker-only-change-this-secret-before-deployment
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: ChangeMe123!
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
